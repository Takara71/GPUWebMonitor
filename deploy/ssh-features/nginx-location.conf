    # Only authenticated node metadata is accepted; no browser-facing reports.
    location = /internal/ssh-features/v1 {
        limit_req zone=ssh_features_ingest burst=20 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:28460/ingest;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        access_log off;
    }

    location = /monitor/api/security {
        auth_request /auth/verify;
        proxy_pass http://127.0.0.1:28460/dashboard;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store, private" always;
        add_header Vary Cookie always;
    }
