server {
    listen 80;
    listen [::]:80;
    listen 28456 default_server;
    listen [::]:28456 default_server;
    server_name status.example.com _;
    server_tokens off;

    root /var/www/lab-status/status;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    client_max_body_size 1m;

    location = / {
        try_files /index.html =404;
    }

    location /status-assets/ {
        alias /var/www/lab-status/status/;
        expires 1h;
    }

    location = /api/status.json {
        alias /var/lib/lab-status/status.json;
        default_type application/json;
        expires -1;
    }

    # Browser desktop: install deploy/remote-desktop/nginx.conf first.
    include /etc/nginx/snippets/lab-desktop.conf;

    location = /auth/verify {
        internal;
        proxy_pass http://127.0.0.1:28458/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/session {
        proxy_pass http://127.0.0.1:28458/session;
        proxy_set_header X-Original-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/request-code {
        limit_req zone=lab_auth_login burst=3 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:28458/request-code;
        proxy_set_header X-Original-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/login {
        limit_req zone=lab_auth_login burst=3 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:28458/login;
        proxy_set_header X-Original-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/logout {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:28458/logout;
        proxy_set_header X-Original-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /monitor {
        return 308 /monitor/;
    }

    location = /monitor/api/config {
        auth_request /auth/verify;
        alias /var/www/lab-status/monitor-config.json;
        default_type application/json;
        expires -1;
    }

    location = /monitor/api/ssh-config {
        auth_request /auth/verify;
        alias /var/www/lab-status/ssh-config.json;
        default_type application/json;
        expires -1;
    }

    location = /api/client-latency/gpu-node-a {
        auth_request /auth/verify;
        limit_req zone=lab_client_probe burst=45 nodelay;
        proxy_pass http://127.0.0.1:15101/api/link-diagnostic;
        include /etc/nginx/snippets/lab-monitor-agent-token.conf;
        include /etc/nginx/snippets/lab-monitor-proxy.conf;
    }

    location = /api/client-latency/gpu-node-b {
        auth_request /auth/verify;
        limit_req zone=lab_client_probe burst=45 nodelay;
        proxy_pass http://127.0.0.1:15102/api/link-diagnostic;
        include /etc/nginx/snippets/lab-monitor-agent-token.conf;
        include /etc/nginx/snippets/lab-monitor-proxy.conf;
    }

    location = /api/client-latency/gpu-node-c {
        auth_request /auth/verify;
        limit_req zone=lab_client_probe burst=45 nodelay;
        proxy_pass http://127.0.0.1:15103/api/link-diagnostic;
        include /etc/nginx/snippets/lab-monitor-agent-token.conf;
        include /etc/nginx/snippets/lab-monitor-proxy.conf;
    }

    location /monitor/api/nodes/gpu-node-a/ {
        auth_request /auth/verify;
        rewrite ^/monitor/api/nodes/gpu-node-a/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:15101;
        include /etc/nginx/snippets/lab-monitor-agent-token.conf;
        include /etc/nginx/snippets/lab-monitor-proxy.conf;
    }

    location /monitor/api/nodes/gpu-node-b/ {
        auth_request /auth/verify;
        rewrite ^/monitor/api/nodes/gpu-node-b/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:15102;
        include /etc/nginx/snippets/lab-monitor-agent-token.conf;
        include /etc/nginx/snippets/lab-monitor-proxy.conf;
    }

    location /monitor/api/nodes/gpu-node-c/ {
        auth_request /auth/verify;
        rewrite ^/monitor/api/nodes/gpu-node-c/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:15103;
        include /etc/nginx/snippets/lab-monitor-agent-token.conf;
        include /etc/nginx/snippets/lab-monitor-proxy.conf;
    }

    location = /monitor/api/security {
        auth_request /auth/verify;
        proxy_pass http://127.0.0.1:28460/dashboard;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store, private" always;
        add_header Vary Cookie always;
    }

    location /monitor/ {
        auth_request /auth/verify;
        error_page 401 = @monitor_login;
        alias /var/www/lab-status/monitor/;
        index index.html;
    }

    location @monitor_login {
        return 303 /?login=1;
    }

    location / {
        try_files $uri =404;
    }
}
