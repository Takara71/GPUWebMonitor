    location = /desktop/node-tunnel {
        proxy_pass http://127.0.0.1:28461;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        access_log off;
    }
    location /desktop/api/ {
        auth_request /auth/verify;
        limit_req zone=lab_desktop_api burst=20 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:28461;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 55s;
        add_header Cache-Control "no-store, private" always;
        access_log off;
    }
    location /desktop/ws/ {
        auth_request /auth/verify;
        proxy_pass http://127.0.0.1:28461;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        access_log off;
    }
    location /desktop/ {
        auth_request /auth/verify;
        error_page 401 = @monitor_login;
        alias /var/www/lab-status/desktop/;
        index index.html;
        add_header Cache-Control "no-store, private" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://status.example.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    }
