<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远程桌面 · 实验室</title><link rel="stylesheet" href="/desktop/desktop.css?v=20260924-independent-1"></head>
<body>
<header class="toolbar"><a href="/">← 状态首页</a><strong id="node-name">远程桌面</strong><span id="connection-state" role="status">正在检查…</span><div class="tools"><label>画质 <select id="quality"><option value="smooth">流畅</option><option value="balanced" selected>均衡</option><option value="sharp">清晰</option></select></label><button id="fullscreen" type="button">全屏</button><button id="ctrl-alt-del" type="button" disabled>Ctrl · Alt · Del</button><button id="disconnect" type="button" disabled>断开并保留</button><button id="end-session" type="button" disabled>结束桌面</button></div></header>
<main id="screen" aria-label="远程桌面画面"></main>
<section class="access-panel" id="access-panel"><div class="monitor-icon" aria-hidden="true">▣</div><h1 id="access-title">连接服务器桌面</h1><p id="occupancy" role="status">正在检查桌面是否可用…</p><form id="connect-form"><label>服务器账号<input id="desktop-username" name="username" autocomplete="username" maxlength="64" required></label><label>服务器密码<input id="desktop-password" name="password" type="password" autocomplete="current-password" maxlength="512" required></label><p class="message" id="message" role="alert" hidden></p><button id="connect" type="submit" disabled>验证并连接</button></form><p class="hint">验证后直接进入该账号的独立桌面，无需再次登录系统。每台服务器同时只允许一个人远程操作；其他账号拥有各自的桌面。</p><p class="hint">“断开并保留”释放占用并保留窗口，下次用相同账号可继续。“结束桌面”关闭本桌面的全部应用，请先保存文件；不会结束从 SSH 启动的任务。</p><p class="hint">OpenGL 软件可使用桌面上的“OpenGL GPU 加速启动”；Vulkan 和 CUDA 软件直接启动即可。</p></section>
<script type="module" src="/desktop/desktop.js?v=20260924-independent-1"></script></body></html>
